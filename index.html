<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d9372b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wendler">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Wendler 5/3/1 Forever – Trainer</title>
<style>
:root{--bg:#f6f4f1;--card:#fff;--ink:#1c1b1a;--mut:#6b6762;--line:#e3dfd9;--acc:#d9372b;--accink:#fff;--ok:#2e7d4f;--warn:#b26a00}
@media (prefers-color-scheme:dark){:root{--bg:#161514;--card:#201f1d;--ink:#f1eeea;--mut:#a39e97;--line:#37342f;--acc:#ef5a4d;--accink:#1a0705;--ok:#58b57e;--warn:#e0a03a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:130px}
header{background:var(--acc);color:var(--accink);padding:14px 16px}
header h1{margin:0;font-size:18px}
header .sub{font-size:13px;opacity:.92;margin-top:2px}
main{max-width:640px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .lab{flex:1}
.row .lab b{font-size:17px}
.row .lab small{display:block;color:var(--mut)}
.chk{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--ink);font-size:18px;cursor:pointer;flex:none}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;cursor:pointer}
.step span{min-width:26px;text-align:center;font-weight:600}
.dots{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0}
.dots .chk{width:40px;height:40px;font-size:15px}
.btn{display:block;width:100%;padding:14px;border-radius:12px;border:0;background:var(--acc);color:var(--accink);font-size:16px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn+.btn{margin-top:8px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:12px;color:var(--mut)}
.note{border-left:4px solid var(--warn);padding:8px 12px;margin-bottom:12px;background:var(--card);border-radius:8px;font-size:14px}
.pr{color:var(--acc);font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);z-index:5}
nav button{flex:1;padding:12px 2px 14px;background:none;border:0;color:var(--mut);font-size:12px;cursor:pointer}
nav button.on{color:var(--acc);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;text-align:left;border-top:1px solid var(--line)}
th{color:var(--mut);font-weight:600;border-top:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mut{color:var(--mut);font-size:13px}
.prog{display:flex;gap:4px;margin:8px 0}
.prog div{flex:1;height:8px;border-radius:4px;background:var(--line)}
.prog div.done{background:var(--ok)}.prog div.cur{background:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;cursor:pointer}
.chip.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
#tbar{position:fixed;left:8px;right:8px;bottom:56px;display:none;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;z-index:6;box-shadow:0 4px 18px rgba(0,0,0,.25)}
#tbar.done{background:var(--acc);color:var(--accink);animation:fl .6s infinite alternate}
@keyframes fl{to{opacity:.65}}
#tbar .t{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;flex:1}
#tbar button{padding:8px 12px;border-radius:10px;border:1px solid currentColor;background:transparent;color:inherit;font-size:14px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:12px;color:var(--mut);padding:4px 0}
.cal button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:14px;cursor:pointer;position:relative;padding:0}
.cal button.has{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.cal button.today{outline:2px solid var(--acc)}
.cal button.sel{box-shadow:0 0 0 3px var(--acc) inset}
.cal button.empty{visibility:hidden}
.cal button small{position:absolute;bottom:1px;left:0;right:0;font-size:9px;opacity:.9}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;cursor:pointer}
.w{width:84px!important;text-align:right}
</style>
</head>
<body>
<header><h1>Wendler 5/3/1 Forever</h1><div class="sub" id="sub"></div></header>
<main id="app"><div class="card">Lade …</div></main>
<div id="tbar"><div class="t" id="tt"></div><button onclick="addTimer(30)" id="tplus">+30 s</button><button onclick="stopTimer()">Stopp</button></div>
<nav id="nav"></nav>
<script>
//ENGINE_START
const LIFTS=['sq','bp','dl','oh'];
const NAME={sq:'Kniebeuge',bp:'Bankdrücken',dl:'Kreuzheben',oh:'Schulterdrücken'};
const SHORT={sq:'KB',bp:'BD',dl:'KH',oh:'SD'};
const BBBLIFT={sq:'dl',bp:'oh',dl:'sq',oh:'bp'};
const STAGES=[
 {id:'L1',name:'Leader 1',weeks:3,kind:'L'},
 {id:'L2',name:'Leader 2',weeks:3,kind:'L'},
 {id:'D',name:'Deload',weeks:1,kind:'D'},
 {id:'A',name:'Anchor',weeks:3,kind:'A'}];
const LW=[[.65,.75,.85],[.70,.80,.90],[.75,.85,.95]];
const AW=[{p:[.7,.8,.9],r:[3,3,3],pr:3},{p:[.65,.75,.85],r:[5,5,5],pr:0},{p:[.75,.85,.95],r:[5,3,1],pr:1}];
const ACC_L={
 sq:['Kabelrudern 3x12','Dips 3x10-12','Seitheben (Kabel) 3x15','Toes-to-Bar 3x8-12'],
 bp:['Klimmzüge 3x8-10','Seal Row 3x10-12','Cable Chest Fly 3x12-15','GHD Side Crunch 3x12','Reverse Hyper 3x10-12'],
 dl:['Latzug 3x10-12','Bizeps-Curl 3x12','Dips 3x10-12','Toes-to-Bar 3x8-12'],
 oh:['Klimmzüge 3x8-10','Kabelrudern 3x12','Cable Chest Fly 3x12-15','GHD Side Crunch 3x12','Reverse Hyper 3x10-12']};
const ACC_A={
 sq:['Kabelrudern 5x10','Dips 5x10','Seitheben (Kabel) 3x15','Toes-to-Bar 3x10'],
 bp:['Klimmzüge 5x8','Seal Row 3x12','Cable Chest Fly 4x12-15','GHD Side Crunch 3x12','Reverse Hyper 5x10'],
 dl:['Latzug 5x10','Bizeps-Curl 3x12','Dips 5x10','Toes-to-Bar 3x10'],
 oh:['Klimmzüge 5x8','Kabelrudern 3x12','Cable Chest Fly 4x12-15','GHD Side Crunch 3x12','Reverse Hyper 5x10']};
const ACC_D=['Toes-to-Bar 2x8-12','Kabelrudern 2x12'];
const POOL=['Latzug','Kabelrudern','Seal Row','Klimmzüge','Dips','Seitheben (Kabel)','Shrugs','Bizeps-Curl','Trizeps-Pushdown','Cable Chest Fly','Toes-to-Bar','GHD Side Crunch','Reverse Hyper'];
function accFor(S,kind,lift){
  const c=S.accCfg;
  if(kind==='D')return (c&&c.D)||ACC_D;
  const t=c&&c[kind]&&c[kind][lift];
  return t||(kind==='L'?ACC_L[lift]:ACC_A[lift]);
}
function cloneAcc(){const o={L:{},A:{},D:ACC_D.slice()};LIFTS.forEach(l=>{o.L[l]=ACC_L[l].slice();o.A[l]=ACC_A[l].slice();});return o;}

const rnd=(x,r)=>Math.round(x/(r||2.5))*(r||2.5);
const r1=x=>Math.round(x*10)/10;
const fmt=x=>String(Math.round(x*100)/100).replace('.',',');
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseAcc(s){const m=/^(.*?)\s+(\d+)x([\d-]+)$/.exec(s);return m?{name:m[1],sets:+m[2],reps:m[3]}:{name:s,sets:1,reps:''};}

function defState(){
  const cfg={tmPct:0.9,round:2.5,bbb:{sq:.5,bp:.6,dl:.5,oh:.6},step:{sq:5,bp:2.5,dl:5,oh:2.5},rest:{main:180,extra:90,acc:90,auto:true}};
  const e1rm={sq:115,bp:97,dl:160,oh:55.5};
  const tm={};LIFTS.forEach(l=>tm[l]=rnd(e1rm[l]*cfg.tmPct,cfg.round));
  return {v:2,cfg,e1rm,tm,block:1,stage:0,week:1,day:0,pending:null,
    fails:{sq:0,bp:0,dl:0,oh:0},stageFail:{},deloadFail:{},pr:{},cur:null,history:[],days:{},lastW:{},accCfg:null,blockLog:[],notice:[],_t:0};
}

function plan(S){
  const st=STAGES[S.stage],lift=LIFTS[S.day],tm=S.tm[lift],R=S.cfg.round;
  const warm=[[.4,5],[.5,5],[.6,3]].map(a=>({w:rnd(tm*a[0],R),r:a[1]}));
  let main=[],extra=null,acc=[];
  if(st.kind==='L'){
    main=LW[S.week-1].map(p=>({w:rnd(tm*p,R),r:5,min:5,pr:false}));
    const bl=BBBLIFT[lift];
    extra={name:'BBB '+NAME[bl],sets:5,reps:10,w:rnd(S.tm[bl]*S.cfg.bbb[bl],R),pct:S.cfg.bbb[bl]};
    acc=accFor(S,'L',lift);
  }else if(st.kind==='A'){
    const a=AW[S.week-1];
    main=a.p.map((p,i)=>({w:rnd(tm*p,R),r:a.r[i],min:a.r[i],pr:i===2&&a.pr>0}));
    extra={name:'FSL '+NAME[lift],sets:5,reps:5,w:main[0].w,pct:a.p[0]};
    acc=accFor(S,'A',lift);
  }else{
    main=[[.7,5],[.8,3],[.9,1],[1,1]].map(a=>({w:rnd(tm*a[0],R),r:a[1],min:a[1],pr:false,test:a[0]===1}));
    acc=accFor(S,'D',lift);
  }
  return {st,lift,tm,warm,main,extra,acc:acc.map(parseAcc)};
}

function ensureCur(S){
  if(S.cur)return;
  const p=plan(S);
  S.cur={main:p.main.map(m=>({reps:m.r,done:false})),warm:p.warm.map(()=>false),
    extra:p.extra?Array(p.extra.sets).fill(false):[],
    acc:p.acc.map(a=>({d:Array(a.sets).fill(false),r:Array(a.sets).fill(defReps(a.reps)),w:(S.lastW&&S.lastW[a.name])||''}))};
}
function rebuildAcc(S){
  if(!S.cur)return;
  const p=plan(S);
  S.cur.acc=p.acc.map(a=>({d:Array(a.sets).fill(false),r:Array(a.sets).fill(defReps(a.reps)),w:(S.lastW&&S.lastW[a.name])||''}));
}
function defReps(s){const m=/(\d+)\s*$/.exec(String(s||''));return m?parseInt(m[1],10):0;}
const BW=['Dips','Klimmzüge','Toes-to-Bar','GHD Side Crunch','Reverse Hyper'];

function endStage(S){
  const st=STAGES[S.stage],notes=[];
  if(st.kind==='L'){
    const nt={};
    LIFTS.forEach(l=>{
      if(S.stageFail[l]){
        S.fails[l]=(S.fails[l]||0)+1;
        if(S.fails[l]>=2){nt[l]=rnd(S.tm[l]*0.9,S.cfg.round);S.fails[l]=0;notes.push(NAME[l]+': zweimal nicht geschafft, TM um 10 % zurückgesetzt auf '+fmt(nt[l])+' kg');}
        else{nt[l]=S.tm[l];notes.push(NAME[l]+': Wiederholungen verfehlt, TM bleibt bei '+fmt(nt[l])+' kg (kein Anstieg)');}
      }else{S.fails[l]=0;nt[l]=S.tm[l]+S.cfg.step[l];}
    });
    if(st.id==='L1')S.tm=nt;else S.pending=nt;
  }else if(st.kind==='D'){
    if(S.pending){
      LIFTS.forEach(l=>{
        let t=S.pending[l];
        if(S.deloadFail[l]){t=rnd(t*0.95,S.cfg.round);notes.push(NAME[l]+': TM-Satz nicht geschafft, TM auf '+fmt(t)+' kg gesenkt');}
        S.tm[l]=t;
      });
      S.pending=null;
    }
    S.deloadFail={};
  }else{
    const old=Object.assign({},S.tm);
    LIFTS.forEach(l=>{
      const pr=S.pr[l]||{};
      const es=Object.keys(pr).map(k=>pr[k].w*(1+pr[k].reps*0.0333));
      if(es.length){const e=Math.max.apply(null,es);S.e1rm[l]=r1(e);S.tm[l]=rnd(e*S.cfg.tmPct,S.cfg.round);}
      else notes.push(NAME[l]+': kein PR-Satz erfasst, TM unverändert');
    });
    S.blockLog.unshift({block:S.block,old:old,tm:Object.assign({},S.tm),e1rm:Object.assign({},S.e1rm)});
    S.block++;S.pr={};S.fails={sq:0,bp:0,dl:0,oh:0};
    notes.push('Block '+(S.block-1)+' fertig. Neue TMs aus den PR-Sätzen berechnet.');
  }
  S.stageFail={};S.stage=(S.stage+1)%STAGES.length;S.week=1;S.day=0;
  S.notice=notes;
}

function finishSession(S,date){
  ensureCur(S);
  const p=plan(S),st=p.st,lift=p.lift,c=S.cur;
  let failed=false;
  const sets=p.main.map((m,i)=>{
    const r=c.main[i].done?c.main[i].reps:0;
    if(st.kind!=='D'&&r<m.min)failed=true;
    if(st.kind==='A'&&m.pr&&r>0){S.pr[lift]=S.pr[lift]||{};S.pr[lift]['w'+S.week]={w:m.w,reps:r};}
    return {w:m.w,r:r,t:m.r};
  });
  if(st.kind==='D'&&!(c.main[3].done&&c.main[3].reps>=1))S.deloadFail[lift]=true;
  if(failed)S.stageFail[lift]=true;
  let accDone=0,accTot=0;const accs=[];
  c.acc.forEach((a,i)=>{
    accTot+=a.d.length;accDone+=a.d.filter(Boolean).length;
    const w=parseFloat(String(a.w).replace(',','.'));
    if(a.d.some(Boolean)&&w>0){S.lastW=S.lastW||{};S.lastW[p.acc[i].name]=w;}
    if(a.d.some(Boolean))accs.push({n:p.acc[i].name,w:w>0?w:0,r:a.d.map((x,j)=>x?(a.r?a.r[j]:0):null).filter(x=>x!==null)});
  });
  S.history.unshift({d:date,block:S.block,stage:st.id,week:S.week,lift:lift,tm:p.tm,sets:sets,
    extra:c.extra.filter(Boolean).length+'/'+c.extra.length,acc:accDone+'/'+accTot,accs:accs,failed:failed});
  if(S.history.length>200)S.history.length=200;
  S.days=S.days||{};S.days[date]=(S.days[date]||[]).concat([lift]);
  S.cur=null;S.notice=[];
  S.day++;
  if(S.day>=4){S.day=0;S.week++;if(S.week>st.weeks)endStage(S);}
}
//ENGINE_END

/* ---------- Persistenz ---------- */
let S=defState(),TAB='heute',SAVEMSG='',dbDoc=null,saving=false,dirty=false,saveTimer=null,UID=null,UNAME='',CAL=null;
function lsKey(){return 'wendler531_v2_'+(UID||'anon');}
function lsSave(){try{localStorage.setItem(lsKey(),JSON.stringify(S));}catch(e){}}
function lsLoad(){try{const t=localStorage.getItem(lsKey());return t?JSON.parse(t):null;}catch(e){return null;}}
function save(){S._t=Date.now();lsSave();dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);}
async function flush(){
  if(!dbDoc){SAVEMSG=UID?'nur lokal gespeichert':'nicht angemeldet – nur lokal';paintSub();return;}
  if(saving){saveTimer=setTimeout(flush,700);return;}
  saving=true;dirty=false;
  try{await dbDoc.set({json:JSON.stringify(S),t:S._t||Date.now()});SAVEMSG='synchronisiert';}
  catch(e){SAVEMSG='nur lokal gespeichert';}
  saving=false;paintSub();
  if(dirty)saveTimer=setTimeout(flush,700);
}
function normalize(x){
  const d=defState();
  const s=Object.assign(d,x||{});
  const dc=defState().cfg,xc=(x&&x.cfg)||{};
  s.cfg=Object.assign(dc,xc);
  ['bbb','step','rest'].forEach(k=>s.cfg[k]=Object.assign(defState().cfg[k],xc[k]||{}));
  if(!s.days||typeof s.days!=='object')s.days={};
  if(!Object.keys(s.days).length&&Array.isArray(s.history))s.history.forEach(e=>{s.days[e.d]=(s.days[e.d]||[]).concat([e.lift]);});
  if(s.cur&&(!Array.isArray(s.cur.acc)||(s.cur.acc.length&&(typeof s.cur.acc[0]!=='object'||!Array.isArray(s.cur.acc[0].r)))))s.cur=null;
  if(!s.lastW)s.lastW={};
  return s;
}
function applyRemote(d){
  try{
    S=normalize(JSON.parse(d.json));S._t=d.t||S._t||0;lsSave();
    const ae=document.activeElement;
    if(TAB!=='einst'&&TAB!=='test'&&TAB!=='acc'&&!(ae&&ae.tagName==='INPUT'))render();else paintSub();
  }catch(e){}
}
async function boot(){
  let db=null,user=null;
  try{
    if(window.claude&&window.claude.use){
      db=await window.claude.use('db');user=await window.claude.use('user');
      UID=user&&user.id?await user.id():null;
    }
  }catch(e){}
  if(user&&UID){try{const ps=await user.profiles([UID]);UNAME=(ps&&ps[UID]&&ps[UID].name)||'';}catch(e){}}
  const loc=lsLoad();if(loc)S=normalize(loc);
  if(db&&UID){
    try{
      dbDoc=db.doc('data/users/'+UID+'/state');
      const snap=await Promise.race([dbDoc.get(),new Promise((_,rej)=>setTimeout(()=>rej(0),10000))]);
      const rd=snap.exists?snap.data():null;
      if(rd&&rd.json&&(rd.t||0)>(S._t||0)){S=normalize(JSON.parse(rd.json));S._t=rd.t;lsSave();}
      else if(!rd||!rd.json||(S._t||0)>(rd.t||0)){dirty=true;}
      dbDoc.onSnapshot(sn=>{
        if(!sn.exists)return;const d=sn.data();
        if(!d||!d.json||(sn.metadata&&sn.metadata.hasPendingWrites))return;
        if((d.t||0)>(S._t||0))applyRemote(d);
      },()=>{});
      SAVEMSG='synchronisiert';
      if(dirty)flush();
    }catch(e){dbDoc=null;SAVEMSG='nur lokal gespeichert';}
  }else SAVEMSG='nicht angemeldet – nur lokal';
  render();
}

/* ---------- Timer ---------- */
let T={end:0,iv:null,done:false},AC=null;
function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.resume)AC.resume();}catch(e){}}
function beep(){try{unlockAudio();[0,.4,.8].forEach(o=>{const os=AC.createOscillator(),g=AC.createGain();os.connect(g);g.connect(AC.destination);os.frequency.value=880;g.gain.value=.2;os.start(AC.currentTime+o);os.stop(AC.currentTime+o+.25);});}catch(e){}}
function startTimer(sec){
  unlockAudio();sec=Math.max(5,Math.round(sec));
  T.end=Date.now()+sec*1000;T.done=false;clearInterval(T.iv);T.iv=setInterval(tick,250);tick();
}
function tick(){
  const left=Math.ceil((T.end-Date.now())/1000);
  if(left<=0){clearInterval(T.iv);T.iv=null;T.done=true;beep();try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300]);}catch(e){}paintTimer();return;}
  paintTimer(left);
}
function addTimer(s){if(T.done||!T.end){startTimer(s);return;}T.end+=s*1000;tick();}
function stopTimer(){clearInterval(T.iv);T.iv=null;T.end=0;T.done=false;paintTimer();}
function paintTimer(left){
  const b=document.getElementById('tbar');if(!b)return;
  if(!T.end&&!T.done){b.style.display='none';return;}
  b.style.display='flex';b.className=T.done?'done':'';
  const tp=document.getElementById('tplus');if(tp)tp.style.display=T.done?'none':'';
  document.getElementById('tt').textContent=T.done?'Pause vorbei':String(Math.floor(left/60)).padStart(1,'0')+':'+String(left%60).padStart(2,'0');
}
function autoRest(kind){if(S.cfg.rest.auto)startTimer(S.cfg.rest[kind]);}

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
function paintSub(){
  const st=STAGES[S.stage];
  $('sub').textContent='Block '+S.block+' · '+st.name+' · Woche '+S.week+'/'+st.weeks+' · '+(UID?(UNAME||'angemeldet'):'nicht angemeldet')+' · '+SAVEMSG;
}
function setTab(t){TAB=t;render();window.scrollTo(0,0);}

  }
  h+='</div><div class="mut" style="margin-top:8px">Diesen Monat: '+inMonth+' Einheiten · Gesamt: '+total+'</div></div>';

  LIFTS.forEach(l=>{h+='<div><label>'+NAME[l]+' Gewicht (kg)</label><input id="tw_'+l+'" type="number" inputmode="decimal" step="0.5" oninput="calcTest()"></div><div><label>'+NAME[l]+' Wdh.</label><input id="tr_'+l+'" type="number" inputmode="numeric" oninput="calcTest()"></div>';});
  h+='</div><div id="tres" style="margin-top:10px"></div>'

function testVals(){
  const out={};
  LIFTS.forEach(l=>{
    const w=num('tw_'+l),r=parseInt($('tr_'+l).value,10);
    if(w>0&&r>0){const e=r===1?w:w*(1+r*0.0333);out[l]={e:r1(e),tm:rnd(e*S.cfg.tmPct,S.cfg.round)};}
  });
  return out;
}
function calcTest(){
  const v=testVals();
  const ks=Object.keys(v);
  $('tres').innerHTML=ks.length?'<table><tr><th>Lift</th><th>1RM (geschätzt)</th><th>TM</th></tr>'+ks.map(l=>'<tr><td>'+NAME[l]+'</td><td>'+fmt(v[l].e)+' kg</td><td><b>'+fmt(v[l].tm)+' kg</b></td></tr>').join('')+'</table>':'<div class="mut">Noch keine Werte.</div>';
}
let ARMT=0;
function applyTest(){
  const v=testVals(),ks=Object.keys(v);
  if(!ks.length){calcTest();return;}
  if(!ARMT){ARMT=1;$('tapply').textContent='Nochmal tippen zum Übernehmen';setTimeout(()=>{ARMT=0;const b=$('tapply');if(b)b.textContent='Als Startwerte übernehmen (Neustart bei Block 1)';},4000);return;}
  ARMT=0;
  ks.forEach(l=>{S.e1rm[l]=v[l].e;S.tm[l]=v[l].tm;});
  S.block=1;S.stage=0;S.week=1;S.day=0;S.pending=null;S.pr={};S.stageFail={};S.deloadFail={};
  S.fails={sq:0,bp:0,dl:0,oh:0};S.cur=null;

  save();TAB='heute';render();window.scrollTo(0,0);
}

function accTouch(re){save();if(re)render();}

function accSet(i,f,v){
  const l=accList(),a=parseAcc(l[i]);

function accReset(){
  const l=accList();

function fin(){
  finishSession(S,ymd(new Date()));
  save();render();window.scrollTo(0,0);
}
const num=id=>parseFloat(String($(id).value).replace(',','.'));
function saveEinst(){
  LIFTS.forEach(l=>{
    const e=num('e_'+l),t=num('t_'+l),b=num('b_'+l),s=num('s_'+l);
    if(e>0)S.e1rm[l]=e;if(t>0)S.tm[l]=t;if(b>0&&b<1)S.cfg.bbb[l]=b;if(s>0)S.cfg.step[l]=s;
  });
  ['main','extra','acc'].forEach(k=>{const v=num('r_'+k);if(v>=10)S.cfg.rest[k]=Math.round(v);});
  const p=num('tmpct');if(p>0.5&&p<1)S.cfg.tmPct=p;
  S.cur=null;save();render();
}
function recalcTm(){
  saveEinst();
  LIFTS.forEach(l=>S.tm[l]=rnd(S.e1rm[l]*S.cfg.tmPct,S.cfg.round));
  S.cur=null;save();render();
}
function savePos(){
  S.stage=parseInt($('p_stage').value,10);
  S.week=Math.min(parseInt($('p_week').value,10),STAGES[S.stage].weeks);
  S.day=parseInt($('p_day').value,10);
  S.block=Math.max(1,parseInt($('p_block').value,10)||1);
  S.cur=null;S.stageFail={};save();TAB='heute';render();
}
function doExport(){$('ex').value=JSON.stringify(S);try{$('ex').select();navigator.clipboard.writeText($('ex').value);}catch(e){}}
function doImport(){try{const x=JSON.parse($('ex').value);S=normalize(x);S.cur=null;save();TAB='heute';render();}catch(e){$('ex').value='Ungültiges JSON';}}
function doReset(){if(S._confirm){S=defState();save();TAB='heute';render();}else{S._confirm=true;$('ex').value='Nochmal tippen zum endgültigen Zurücksetzen.';setTimeout(()=>{delete S._confirm;},4000);}}
boot();
</script>

try{if('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/claude\.(ai|site)|claudeusercontent/.test(location.hostname)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}}catch(e){}
</script>
